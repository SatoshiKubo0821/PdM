name: Supabase Keepalive

# Supabase無料プランは一定期間DBへのアクセスがないとプロジェクトが自動停止する。
# 停止すると管理画面のログインや診断結果の保存が「Failed to fetch」で動かなくなるため、
# 定期的にDBへ軽いクエリを投げて稼働状態を保つ。

on:
  schedule:
    # 3日ごと 00:00 UTC（日本時間 9:00）に実行
    - cron: "0 0 */3 * *"
  workflow_dispatch: {} # 手動実行もできるようにする

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          # index.html / admin/index.html に埋め込み済みの公開(anon)キーと同じもの
          SUPABASE_URL: https://qdwiaedhairoythkqxoh.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkd2lhZWRoYWlyb3l0aGtxeG9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNTY3NDUsImV4cCI6MjEwMzczMjc0NX0.zMy2DCPil6T59RgSddJmKkELkh5mZpMRrKvufzXP51A
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/get_aggregate_stats" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            echo "::error::Supabaseに接続できませんでした。プロジェクトが停止していないかダッシュボードで確認してください。"
            exit 1
          fi

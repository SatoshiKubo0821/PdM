  .subskill-item p{font-size:13px; color:var(--ink-soft); margin:4px 0 0;}

  .other-item{

        ["英語でのグローバルGTM展開","英語を用いて、海外市場向けのGo-to-Market戦略を立案・実行できる"],
        ["各国に応じたGTM戦略の実行","国や地域ごとの商習慣・文化の違いを踏まえ、ローカライズしたGTM戦略を実行できる"],
      ]
    },
  };

  const MODULE_ORDER = ["strategy","research","direction","requirement","design","release","communication","consulting","success","global"];

  const params = new URLSearchParams(window.location.search);
  const key = params.get("m");
  const activeKey = MODULES[key] ? key : "strategy";
  const mod = MODULES[activeKey];

  document.title = mod.name + "｜PdM登竜門";
  document.getElementById("pageTitle").textContent = mod.name + "｜PdM登竜門";
  document.getElementById("pageDesc").setAttribute("content", mod.lead);
  document.getElementById("heroIcon").style.background = mod.color;
  document.getElementById("heroIcon").innerHTML = `<svg viewBox="0 0 24 24">${mod.icon}</svg>`;
  document.getElementById("heroNum").textContent = "MODULE " + mod.num + " / 10";
  document.getElementById("heroTitle").textContent = mod.name;
  document.getElementById("heroLead").textContent = mod.lead;
  document.getElementById("outcomeText").textContent = mod.outcome;

  document.getElementById("subskillList").innerHTML = mod.subs.map(s => `
    <div class="subskill-item">
      <div class="subskill-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
      <div><h4>${s[0]}</h4><p>${s[1]}</p></div>
    </div>`).join("");

  document.getElementById("otherGrid").innerHTML = MODULE_ORDER.filter(k => k !== activeKey).map(k => {
    const m = MODULES[k];
    return `<a class="other-item" href="./module.html?m=${k}">
      <div class="other-badge" style="background:${m.color};"><svg viewBox="0 0 24 24">${m.icon}</svg></div>
      ${m.name}
    </a>`;
  }).join("");

  // 診断結果ページから渡された文脈があれば、応募リンクに引き継ぐ
  (function(){
    const p = new URLSearchParams(window.location.search);
    const ctxParams = new URLSearchParams();
    ["pdmType","seniority","hensachi"].forEach(k=>{ if(p.has(k)) ctxParams.set(k, p.get(k)); });
    if([...ctxParams.keys()].length){
      document.getElementById("ctaApplyBtn").href = "./apply.html?" + ctxParams.toString();
    }
  })();
</script>

</body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F9FE;
    --paper: #FFFFFF;
    --ink: #16213D;
    --ink-soft: #5D6B8A;
    --line: #E3E8F5;

    /* key color: vivid blue (バクラク風) */
    --navy-950: #0F1A3D;
    --navy-900: #16244D;
    --navy-800: #1F3A6E;
    --blue-500: #2952E3;
    --blue-300: #6E8CF5;
    --blue-100: #DCE5FE;

    --gold: #FF8A3D;
    --gold-soft: #FFEDDD;
    --good: #2E8F6C;
    --bad: #E14B4B;
    --radius: 12px;

    --grad-main: linear-gradient(135deg, var(--navy-900) 0%, var(--blue-500) 55%, var(--blue-300) 100%);
    --grad-soft: linear-gradient(135deg, rgba(41,82,227,.10) 0%, rgba(110,140,245,.04) 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP", sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:56px 24px 96px;
  }
  /* ---------- Site header ---------- */
  .site-header{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:50;
  }
  .site-header-inner{
    max-width:780px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .site-logo{
    display:flex; align-items:center; gap:8px; text-decoration:none;
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:15px; color:var(--ink);
  }
  .site-logo-dot{width:9px; height:9px; border-radius:50%; background:var(--gold);}
  .site-nav{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .site-nav a{
    color:var(--ink-soft); font-size:13px; font-weight:600; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .site-nav a:hover{color:var(--blue-500);}
  .ext-badge{
    font-size:10px; background:var(--bg); color:var(--ink-soft); padding:1px 6px; border-radius:8px; font-weight:700;
  }
  .auth-pill{
    display:inline-flex; align-items:center; gap:8px; background:var(--bg); border-radius:20px; padding:5px 6px 5px 12px;
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }
  .auth-pill button{
    border:none; background:var(--paper); color:var(--ink-soft); font-size:11.5px; font-weight:700;
    padding:5px 10px; border-radius:16px; cursor:pointer; border:1px solid var(--line);
  }
  .google-btn{
    display:inline-flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line);
    padding:7px 14px 7px 8px; border-radius:20px; font-size:12.5px; font-weight:700; color:var(--ink);
    cursor:pointer; font-family:"Noto Sans JP",sans-serif;
  }
  .google-btn:hover{border-color:var(--blue-500);}
  .google-btn svg{width:16px; height:16px;}
  @media (max-width:600px){
    .site-header-inner{flex-direction:column; align-items:flex-start; gap:10px;}
    .site-nav{width:100%; justify-content:space-between;}
  }
  h1,h2,h3{
    font-family:"Zen Kaku Gothic New", sans-serif;
    margin:0;
    color:var(--navy-900);
  }
  .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.02em;
    margin-bottom:10px;
  }
  .eyebrow b{color:var(--blue-500);}

  /* ---------- Intro ---------- */
  .hero-title{
    font-size:38px;
    font-weight:900;
    line-height:1.35;
    letter-spacing:-.01em;
  }
  .hero-lead{
    margin-top:18px;
    font-size:16px;
    color:var(--ink-soft);
    max-width:58ch;
  }
  .hero-visual{
    margin:36px 0 8px;
    display:flex;
    justify-content:center;
  }
  /* イントロ画面の実績バー（バクラク風の大きい数字） */
  .intro-stat-bar{
    display:flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    margin:32px 0;
    box-shadow:0 16px 32px -26px rgba(22,33,77,.25);
  }
  .intro-stat-item{flex:1; text-align:center; padding:20px 10px; border-right:1px solid var(--line);}
  .intro-stat-item:last-child{border-right:none;}
  .intro-stat-num{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:26px; color:var(--gold);}
  .intro-stat-label{font-size:11px; color:var(--ink-soft); margin-top:2px; font-weight:600;}

  .cat-list{
    margin-top:24px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .cat-list a, .cat-list div.cat-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .cat-list a:hover, .cat-list div.cat-card:hover{transform:translateY(-2px); box-shadow:0 12px 24px -20px rgba(22,33,77,.35); border-color:var(--blue-300);}
  .cat-icon{
    flex-shrink:0; width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .cat-icon svg{width:17px; height:17px;}
  .cat-card-text{flex:1;}
  .cat-card-num{font-size:10.5px; color:var(--ink-soft); font-weight:700; display:block;}
  .cat-card-count{color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:12px; flex-shrink:0;}
  .start-row{
    margin-top:40px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  button.primary, a.primary{
    background:var(--grad-main);
    color:#fff;
    border:none;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:800;
    font-size:15px;
    padding:15px 30px;
    border-radius:100px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 10px 24px -8px rgba(41,82,227,.5);
    display:inline-block;
    text-decoration:none;
    box-sizing:border-box;
  }
  button.primary:hover, a.primary:hover{transform:translateY(-2px); box-shadow:0 14px 28px -8px rgba(41,82,227,.6);}
  button.primary:active, a.primary:active{transform:translateY(0) scale(.98);}
  button.ghost{
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--ink);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:600;
    font-size:14px;
    padding:13px 24px;
    border-radius:100px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  button.ghost:hover{border-color:var(--blue-500); color:var(--blue-500);}
  .resume-note{font-size:13px;color:var(--ink-soft);}

  /* ---------- Assessment (1ページ10問のカードリスト。同意尺度は16personalities風の円サイズ表現) ---------- */
  .thin-progress{
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .thin-progress i{
    display:block;
    height:100%;
    width:0%;
    background:var(--grad-main);
    transition:width .3s ease;
  }
  .q-counter{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:32px;
    font-weight:600;
  }
  .q-card-list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .q-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 24px 22px;
    text-align:center;
  }
  .q-card:has(.scale-circle.on){border-color:var(--blue-300);}
  .q-card-statement{
    font-size:17px;
    font-weight:700;
    line-height:1.6;
    font-family:"Zen Kaku Gothic New",sans-serif;
    color:var(--ink);
    margin-bottom:26px;
    max-width:560px;
    margin-left:auto;
    margin-right:auto;
  }
  .scale-row{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:14px;
  }
  .scale-circle-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    width:82px;
  }
  .scale-circle{
    border-radius:50%;
    background:#fff;
    border:2px solid var(--line);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .scale-circle-wrap:hover .scale-circle{border-color:var(--blue-500); transform:scale(1.06);}
  .scale-circle.on{
    background:var(--grad-main);
    border-color:transparent;
    box-shadow:0 8px 18px -6px rgba(41,82,227,.55);
  }
  /* ラベルの有無に関わらず全列に同じ高さの枠を確保することで、円の下端をきれいに揃える */
  .scale-label{
    font-size:11.5px;
    color:var(--ink-soft);
    max-width:82px;
    line-height:1.4;
    min-height:32px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .q-nav{
    display:flex;
    justify-content:center;
    margin-top:40px;
  }
  .q-nav-split{justify-content:space-between;}

  /* ---------- MBTI screen ---------- */
  .mbti-card-groups{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .mbti-group-label{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:13px;
    margin-bottom:10px;
    letter-spacing:.02em;
  }
  .mbti-card-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .mbti-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:16px 8px 14px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .mbti-card:hover{transform:translateY(-2px); box-shadow:0 8px 18px -10px rgba(16,28,54,.35); border-color:var(--blue-300);}
  .mbti-card.on{
    background:var(--card-grad, var(--grad-main));
    border-color:transparent;
    box-shadow:0 10px 22px -10px rgba(16,28,54,.5);
  }
  .mbti-card.on .mbti-card-icon{color:#fff;}
  .mbti-card.on .mbti-card-code{color:#fff;}
  .mbti-card.on .mbti-card-nick{color:rgba(255,255,255,.85);}
  .mbti-card-icon{color:var(--navy-800); display:flex; align-items:center; justify-content:center; height:24px;}
  .mbti-card-code{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:13.5px; color:var(--ink);}
  .mbti-card-nick{font-size:11px; color:var(--ink-soft);}
  .mbti-card.on .mbti-card-nick{opacity:.9;}
  .mbti-card.unknown{
    align-self:flex-start;
    flex-direction:row;
    gap:10px;
    padding:12px 20px;
    width:fit-content;
  }
  .mbti-card.unknown .mbti-card-icon{
    width:22px; height:22px; border-radius:50%;
    background:var(--line); color:var(--ink-soft);
    font-size:12px; font-weight:700;
  }
  .mbti-card.unknown.on{background:var(--navy-800);}

  .mbti-preview{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    min-height:56px;
    margin-top:22px;
  }
  .mbti-icon{
    width:48px; height:48px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    color:#fff;
    box-shadow:0 6px 16px -6px rgba(16,28,54,.5);
  }
  .mbti-preview-text{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  .mbti-preview-text b{display:block; font-size:15px; color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif; margin-bottom:2px;}

  /* 語学力・資格 入力フォーム */
  .profile-form{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    max-width:480px;
  }
  .profile-label{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }
  .profile-input{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    font-size:15px;
    font-family:"Noto Sans JP",sans-serif;
    color:var(--ink);
    background:var(--paper);
  }
  .profile-input:focus{outline:2px solid var(--blue-300); border-color:var(--blue-500);}
  .profile-textarea{resize:vertical; font-family:inherit;}

  @media (max-width:600px){
    .mbti-card-grid{grid-template-columns:repeat(2,1fr);}
    .scale-row{gap:8px;}
    .scale-circle-wrap{width:58px;}
    .scale-label{font-size:10px; max-width:58px; min-height:28px;}
    .q-card-statement{font-size:15.5px;}
    .q-card{padding:22px 16px 18px;}
  }
  @media (max-width:380px){
    .scale-row{gap:2px;}
    .scale-circle-wrap{transform:scale(.85); width:50px;}
  }

  /* ---------- Results ---------- */
  .score-hero{
    display:flex;
    align-items:center;
    gap:28px;
    margin-top:18px;
    padding:26px 28px;
    border-radius:8px;
    background:var(--grad-main);
    color:#fff;
    flex-wrap:wrap;
  }
  .score-num{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:60px;
    font-weight:900;
    line-height:1;
  }
  .score-den{font-size:14px; opacity:.75; margin-top:4px;}
  .score-tags{display:flex; flex-direction:column; gap:8px;}
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    width:fit-content;
  }
  .tag.gold{background:var(--gold-soft); color:#7A4E14;}

  /* 結果ページ専用：大きく美しいMBTIエンブレム */
  .mbti-emblem-block{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:20px;
    padding:20px 24px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .mbti-emblem{
    position:relative;
    width:104px; height:104px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    box-shadow:0 12px 26px -10px rgba(16,28,54,.35);
  }
  .mbti-emblem::before{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid currentColor;
    opacity:.55;
  }
  .mbti-emblem svg{width:60px; height:60px; position:relative; z-index:1;}
  .mbti-emblem-text{}
  .mbti-emblem-text .code{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:20px; color:var(--navy-900);}
  .mbti-emblem-text .nick{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .mbti-emblem-text .grp{display:inline-block; margin-top:6px; font-size:11px; padding:2px 10px; border-radius:10px; background:var(--bg); color:var(--ink-soft);}

  /* 偏差値・年収などの指標タイル */
  .metric-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:16px;
  }
  .metric-tile{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
  }
  .metric-label{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .metric-value{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:32px;
    font-weight:900;
    margin-top:4px;
    background:var(--grad-main);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .metric-value.salary{font-size:22px;}
  .metric-note{font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.6;}

  /* 求人カード */
  .job-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-top:10px;
    display:block;
    text-decoration:none;
    color:inherit;
    transition:border-color .12s ease, transform .12s ease;
  }
  .job-card:hover{border-color:var(--blue-300); transform:translateY(-1px);}
  .job-company{font-size:12.5px; color:var(--ink-soft);}
  .job-title{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:14.5px; margin-top:2px;}
  .job-meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; align-items:center;}
  .job-salary{font-size:13px; color:var(--navy-900); font-weight:700;}
  .job-source{font-size:11px; color:var(--ink-soft); background:var(--bg); padding:2px 9px; border-radius:10px;}

  /* SWOT 四象限 */
  .swot-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-top:16px;
  }
  .swot-quad{background:var(--paper); padding:18px 20px;}
  .swot-quad.s{border-top:3px solid var(--good);}
  .swot-quad.w{border-top:3px solid var(--bad);}
  .swot-quad.o{border-top:3px solid var(--blue-500);}
  .swot-quad.t{border-top:3px solid var(--gold);}
  .swot-head{

/* ---------------- PdM偏差値 ----------------
   35項目の自己評価平均を、簡易的な偏差値（平均50・標準偏差10）に変換したもの。
   国内PdM人口全体の統計調査ではなく、本ツール上でのセルフチェックを目安化した参考値。 */
function calcHensachi(avg){
  const assumedMean = 2.8, assumedSD = 0.7;
  const raw = 50 + 10 * (avg - assumedMean) / assumedSD;
  return Math.max(28, Math.min(82, Math.round(raw)));
}
function hensachiComment(h){
  if(h >= 70) return "トップクラス。社内でも希少な即戦力〜牽引役の水準です。";
  if(h >= 60) return "優秀水準。多くの現場で頼れる存在として活躍できます。";
  if(h >= 50) return "平均以上。実務を安定して回せる水準に達しています。";
  if(h >= 40) return "平均的〜成長中。経験を積むほど大きく伸びる時期です。";
  return "これから力をつけていくフェーズ。基礎固めが最優先です。";
}

function matchJobs(pdmTypeKey, seniorityKey){
  const scored = JOBS.map(job=>{
    let score = 0;
    if(job.type === pdmTypeKey) score += 2;
    else if(job.type === "general") score += 1;
    if(job.level === seniorityKey) score += 2;
    return { job, score };
  });
  return scored.sort((a,b)=>b.score-a.score).slice(0,4).map(s=>s.job);
}

/* グループごとにキーカラーを設定（4分類：アナリスト／ディプロマット／センチネル／エクスプローラー） */
const MBTI_GROUPS = {

  NF: { name:"ディプロマット", color:"#2E8F6C", grad:"linear-gradient(135deg,#3EAE86,#1E6E52)" },
  SJ: { name:"センチネル", color:"#2E5FD9", grad:"linear-gradient(135deg,#4E7DEF,#16294C)" },
  SP: { name:"エクスプローラー", color:"#D98F3B", grad:"linear-gradient(135deg,#EFA85B,#B06B1E)" },
};
function mbtiGroupOf(code){
  if(code.includes("N") && code.includes("T")) return "NT";
  if(code.includes("N") && code.includes("F")) return "NF";
  if(code.includes("S") && code.includes("J")) return "SJ";
  return "SP";
}

const AXIS_OPPOSITE = {E:"I",I:"E",S:"N",N:"S",T:"F",F:"T",J:"P",P:"J"};
const AXIS_NAME = {E:"外向", I:"内向", S:"現実", N:"直感", T:"思考", F:"感情", J:"計画", P:"柔軟"};

/* MBTIの軸から見た相性（対極タイプと組むと補い合いやすい、という一般的な考え方の紹介） */
function mbtiTeamFit(mbti){
  if(!mbti) return null;
  const letters = mbti.split("");
  const opp = letters.map(l=>AXIS_OPPOSITE[l]);
  const lines = letters.map((l,i)=>{
    return `${AXIS_NAME[l]}型のあなたは、${AXIS_NAME[opp[i]]}型（${l}に対して${opp[i]}）のメンバーと組むと、ものの見方の違いが補い合いになりやすい軸です。`;
  });
  return lines;
}

/* ---------------- スキル×性格 深掘りマトリクス ----------------
   各カテゴリが「どの2文字（異なる軸から1文字ずつ）と親和性が高いか」を定義。
   ユーザーのMBTIがこの2文字を含むかどうかで affinity を -2/0/+2 の3段階に判定し、
   実際のカテゴリ平均スコアと掛け合わせて「資質と実績の一致／乖離」を分析する。
   ※ 一般的な性格傾向論を業務文脈に翻訳した簡易モデルであり、断定的な適性診断ではない。 */
const CATEGORY_AFFINITY_LETTERS = {
  strategy:      ["N","J"],
  research:      ["N","T"],
  direction:     ["T","J"],
  requirement:   ["T","S"],
  design:        ["S","J"],
  release:       ["J","T"],
  communication: ["E","F"],
  consulting:    ["F","E"],
  global:        ["E","N"],
  success:       ["F","S"],
};

function computeAffinity(mbti, letters){
  return letters.reduce((score,l)=> score + (mbti.includes(l) ? 1 : -1), 0);
}

const MATRIX_LABELS = {
  natural_strength:   { tag:"資質と実績が一致", tone:"strong",
    text:"性格的な資質と実際のスコアが一致した強みです。あなたの「地」の強さなので、より高度な役割を任せても安定して力を発揮できるでしょう。" },
  untapped_potential:{ tag:"伸びしろ大（隠れた適性）", tone:"fusion",
    text:"性格的には向いているのに、実務経験がまだ追いついていない領域です。意識して機会を取りにいけば、投資対効果が最も高く伸びる可能性があります。" },
  overcome_strength:{ tag:"努力で築いた強み", tone:"strong",
    text:"本来は苦手になりやすい資質にもかかわらず、ここまでスコアを積み上げています。意識的な工夫や努力の跡がうかがえる、価値の高い強みです。" },
  double_risk:{ tag:"要フォロー", tone:"weak",
    text:"性格的にも負荷がかかりやすく、実務経験もまだ浅い領域です。一人で抱え込まず、仕組み化するか得意なメンバーに分担することを検討しましょう。" },
  natural_fit_neutral:{ tag:"性格的に向いている", tone:"neutral",
    text:"性格的に向いている領域です。経験を積むほど自然に伸びやすいでしょう。" },
  challenge_in_progress:{ tag:"克服が進行中", tone:"neutral",
    text:"性格的にはやや苦手になりやすい領域ですが、着実に経験を積んで克服が進んでいます。" },
  neutral:{ tag:"ニュートラル", tone:"neutral",
    text:"性格特性による強み・弱みの偏りが少なく、実務経験がそのままスコアに反映されやすい領域です。" },
};

function buildCategoryMatrix(mbti){
  return CATEGORIES.map(cat=>{
    const letters = CATEGORY_AFFINITY_LETTERS[cat.key];
    const affinity = computeAffinity(mbti, letters);
    const avg = categoryAverage(cat);
    let labelKey;
    if(affinity>=2){
      labelKey = avg>=3.5 ? "natural_strength" : (avg<3 ? "untapped_potential" : "natural_fit_neutral");
    }else if(affinity<=-2){
      labelKey = avg>=3.5 ? "overcome_strength" : (avg<3 ? "double_risk" : "challenge_in_progress");
    }else{
      labelKey = "neutral";
    }
    return { cat, avg, affinity, ...MATRIX_LABELS[labelKey] };
  });
}

/* 任せると強い仕事：MBTIの entrust リストと、スキル面で最も評価の高いカテゴリを組み合わせる */
function buildEntrustRecommendation(mbti, pdmType, topCategoryName){
  const profile = MBTI_PROFILE[mbti];
  const combined = `${pdmType.label}としての強みと組み合わせると、特に「${topCategoryName}」に関わる場面で任せると力を発揮しやすいでしょう。`;
  return { entrust: profile.entrust, combined };
}

/* ---------------- SWOT分析 ----------------
   S/W はスキル診断のカテゴリスコアから、O/T はMBTI×スキルの掛け合わせマトリクスから構成する。
   MBTI未選択時はO/Tを簡易フォールバックで表示する。 */
function buildSwot(strengthCats, growthCats, matrix){
  const S = strengthCats.length ? strengthCats.slice(0,3).map(c=>({
    title:c.name,
    desc:`平均${categoryAverage(c).toFixed(1)}。チームの中でも牽引役になれる領域です。`
  })) : [{title:"該当なし", desc:`現時点で平均3.5以上のカテゴリはありません。まずはどれか1カテゴリを3.5以上に伸ばすことを目標にしましょう。`}];

  const W = growthCats.length ? growthCats.slice(0,3).map(c=>({
    title:c.name,
    desc:`平均${categoryAverage(c).toFixed(1)}。${ADVICE[c.key]}`
  })) : [{title:"弱みなし", desc:"全カテゴリが平均3.5以上です。この診断上、明確な弱みは見当たりません。"}];

  let O, T;
  if(matrix){
    const opp = matrix.filter(r=>r.tag==="伸びしろ大（隠れた適性）");
    const thr = matrix.filter(r=>r.tag==="要フォロー");
    O = opp.length ? opp.map(r=>({title:r.cat.name, desc:r.text}))
                   : [{title:"大きな乖離なし", desc:"性格的な資質と実務スコアが大きく乖離している領域は、現時点では見当たりません。"}];
    T = thr.length ? thr.map(r=>({title:r.cat.name, desc:r.text}))
                   : [{title:"要注意ゾーンなし", desc:"性格・実務スコアの両方が低い領域は、現時点では見当たりません。"}];
  }else{
    O = [{title:"MBTIでさらに詳しく", desc:"MBTIを選択すると、性格的には向いているのに実務経験が追いついていない「隠れた適性」を具体的に表示します。"}];
    T = growthCats.length ? growthCats.slice(0,1).map(c=>({
      title:c.name,
      desc:`現時点で最もスコアが低いカテゴリです（平均${categoryAverage(c).toFixed(1)}）。優先して底上げを検討しましょう。`
    })) : [{title:"要注意ゾーンなし", desc:"全カテゴリが平均3.5以上です。"}];
  }
  return { S, W, O, T };
}

                   low: {cats:["release","design"], reason:"安定志向の組織では、品質を担保しながら緻密に設計・リリースする力が重要になります。"} },
  communication: { high:{cats:["consulting","communication"], reason:"率直な文化の組織では、対立を恐れずに期待値調整やフィードバックを行う力が重要になります。"},
                   low: {cats:["success","communication"], reason:"調和を重んじる組織では、関係性を大切にしながら丁寧にコミュニケーションを取る力が重要になります。"} },
};

function orgQuestionKey(idx){ return "org:"+idx; }
function orgEffectiveScore(qIndex, raw){
  if(raw==null) return null;
  const q = ORG_QUESTIONS[qIndex];
  return q.reverse ? (6-raw) : raw;
}
function computeOrgAxisScores(orgAnswers){
  const sums = {}, counts = {};
  ORG_QUESTIONS.forEach((q,i)=>{
    const raw = orgAnswers[orgQuestionKey(i)];
    const eff = orgEffectiveScore(i, raw);
    if(eff==null) return;
    sums[q.axis] = (sums[q.axis]||0) + eff;
    counts[q.axis] = (counts[q.axis]||0) + 1;
  });
  const result = {};
  Object.keys(ORG_AXES).forEach(axis=>{
    result[axis] = counts[axis] ? sums[axis]/counts[axis] : null;
  });
  return result;
}
function orgAxisPole(score){
  if(score==null) return "mid";
  if(score >= 3.5) return "high";
  if(score <= 2.5) return "low";
  return "mid";
}
function orgAxisLabel(axis, score){
  const pole = orgAxisPole(score);
  if(pole==="mid") return "バランス型";
  return pole==="high" ? ORG_AXES[axis].high : ORG_AXES[axis].low;
}
function buildOrgNarrative(orgScores){
  const parts = Object.keys(ORG_AXES).map(axis=>{
    const pole = orgAxisPole(orgScores[axis]);
    return ORG_AXIS_FRAGMENT[axis][pole];
  });
  return `御社は、${parts[0]}と、${parts[1]}を持つ組織のようです。${parts[2]}を持ちつつ、${parts[3]}が特徴として見えてきます。`;
}
/* 組織文化から見て重要度が上がるPdMスキルカテゴリを抽出（重複は理由文をまとめる） */
function buildOrgFocusCategories(orgScores){
  const map = {}; // catKey -> {catKey, reasons:[]}
  Object.keys(ORG_AXES).forEach(axis=>{
    const pole = orgAxisPole(orgScores[axis]);
    if(pole==="mid") return;
    const focus = ORG_TO_PDM_FOCUS[axis][pole];
    focus.cats.forEach(catKey=>{
      if(!map[catKey]) map[catKey] = { catKey, reasons: [] };
      map[catKey].reasons.push(focus.reason);
    });
  });
  return Object.values(map);
}

const STORAGE_KEY = "pdm35:latest";

/* claude.aiのアーティファクト内ではwindow.storageを使い、
   一般公開したWebページではブラウザのlocalStorageに自動フォールバックする。 */
async function loadSaved(){
  try{
    if(window.storage && typeof window.storage.get === "function"){
      const r = await window.storage.get(STORAGE_KEY, false);
      return (r && r.value) ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ /* no saved data, or storage unavailable (e.g. private browsing) */ }
  return null;
}
async function saveProgress(){
  try{
    const payload = JSON.stringify({
      answers:state.answers, mbti:state.mbti, profile:state.profile,
      orgAnswers:state.orgAnswers, orgScores:state.orgScores,
    });
    if(window.storage && typeof window.storage.set === "function"){
      await window.storage.set(STORAGE_KEY, payload, false);
    }else{
      localStorage.setItem(STORAGE_KEY, payload);
    }
  }catch(e){ /* storage unavailable, continue silently */ }
}

/* ---------------- Helpers ---------------- */
function answeredCount(){
  return Object.keys(state.answers).length;
}
/* 全カテゴリの設問を1つのフラットな配列にまとめたもの。
   各要素は {catKey, name, desc, statement, reverse} で、カテゴリをまたいで並ぶ。 */
const ALL_SKILLS_FLAT_META = [];
CATEGORIES.forEach(cat=>{
  cat.skills.forEach(skill=>{
    ALL_SKILLS_FLAT_META.push({ catKey:cat.key, name:skill[0], desc:skill[1], statement:skill[2], reverse:skill[3] });
  });
});
/* Fisher–Yates shuffle。全設問（カテゴリ横断）で一度だけ計算し、以後の再描画では順序を維持する。
   1問ずつ表示する中でカテゴリが混ざるため、メタ回答対策（どのカテゴリの設問かを推測されにくくする）が強化される。
   スキル名そのものではなく「元の配列インデックス」をシャッフルするため、DOM上に設問名が一切露出しない。 */
function shuffledMasterOrder(){
  if(!state.displayOrder.master){
    const arr = ALL_SKILLS_FLAT_META.map((_,i)=>i);
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    state.displayOrder.master = arr;
  }
  return state.displayOrder.master;
}
/* 逆転項目（reverse:true）は回答を6-rawで反転し、実質的なスキルスコアに変換する */
function effectiveScore(catKey, skill){
  const raw = state.answers[catKey+":"+skill[0]];
  if(raw==null) return null;
  return skill[3] ? (6 - raw) : raw;
}
function categoryAverage(cat){
  const vals = cat.skills.map(s => effectiveScore(cat.key, s)).filter(v=>v!=null);
  if(vals.length===0) return 0;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function overallAverage(){
  const vals = [];
  CATEGORIES.forEach(cat=>{
    cat.skills.forEach(s=>{
      const v = effectiveScore(cat.key, s);
      if(v!=null) vals.push(v);
    });
  });
  if(vals.length===0) return 0;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function clusterAverage(clusterKey){
  let sum=0, n=0;
  CATEGORIES.forEach(cat=>{
    cat.skills.forEach(skill=>{
      if(CLUSTER_OF[skill[0]]===clusterKey){
        const v = effectiveScore(cat.key, skill);
        if(v!=null){ sum+=v; n++; }
      }
    });
  });
  return n===0 ? 0 : sum/n;
}
function determinePdmType(){
  const scores = { tech: clusterAverage("tech"), bizdev: clusterAverage("bizdev"), pmm: clusterAverage("pmm") };
  const entries = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const [topKey, topVal] = entries[0];
  const [, secondVal] = entries[1];
  const isBalanced = (topVal - secondVal) < 0.5;
  return { key: isBalanced ? "general" : topKey, scores };
}
function allSkillsFlat(){
  const flat = [];
  CATEGORIES.forEach(cat=>{
    cat.skills.forEach(skill=>{
      const [name,desc] = skill;
      const v = effectiveScore(cat.key, skill);
      if(v!=null) flat.push({ name, desc, catName:cat.name, v });
    });
  });
  return flat;
}

/* ---------------- Supabase連携 ---------------- */
/* 匿名セッションを自動発行し、ページを開くだけで裏側でuser_idが確保される。
   メール連携すれば、同じuser_idのまま別端末からもログインできるようになる。 */
async function ensureSession(){
  if(!supabaseClient) return; // Supabase未設定の場合はローカル保存のみで動作
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session && session.user){
      state.userId = session.user.id;
      state.userEmail = session.user.is_anonymous ? null : (session.user.email || null);
      return;
    }
    const { data, error } = await supabaseClient.auth.signInAnonymously();
    if(!error && data && data.user){
      state.userId = data.user.id;
    }
  }catch(e){ /* ネットワーク不通時などは匿名IDなしで（ローカル保存のみで）継続 */ }
}

async function saveDiagnosisToCloud(payload){
  if(!supabaseClient || !state.userId || state.savedThisResult) return;
  try{
    const { error } = await supabaseClient.from("diagnoses").insert({
      user_id: state.userId,
      answers: state.answers,
      mbti: state.mbti && state.mbti!=="unknown" ? state.mbti : null,
      toeic: state.profile.toeic,
      certifications: state.profile.certifications || null,
      nickname: state.profile.nickname || null,
      experience_years: state.profile.experienceYears,
      overall_avg: payload.avg,
      pdm_type: payload.pdmTypeKey,
      seniority: payload.seniorityKey,
      hensachi: payload.hensachi,
    });
    if(!error) state.savedThisResult = true;
  }catch(e){ /* オフライン等の場合は次回の保存タイミングで再試行される */ }
}

async function fetchHistory(){
  if(!supabaseClient || !state.userId) return [];
  try{
    const { data, error } = await supabaseClient
      .from("diagnoses")
      .select("id, created_at, overall_avg, pdm_type, seniority, hensachi, mbti, nickname, experience_years, answers, toeic, certifications")
      .order("created_at", { ascending:false })
      .limit(20);
    if(error) return [];
    return data || [];
  }catch(e){ return []; }
}

async function linkEmail(email){
  if(!supabaseClient) return { ok:false, message:"Supabaseが未設定です。" };
  try{
    const { error } = await supabaseClient.auth.updateUser({ email });
    if(error) return { ok:false, message:error.message };
    return { ok:true, message:`${email} 宛に確認メールを送信しました。メール内のリンクを開くと連携が完了します。` };
  }catch(e){
    return { ok:false, message:"通信エラーが発生しました。時間をおいて再度お試しください。" };
  }
}

/* Googleアカウントでのログイン。
   匿名セッション中なら linkIdentity() で同じuser_idのまま永久アカウントに昇格（履歴を引き継ぐ）。
   すでに永久アカウントの場合は signInWithOAuth() で通常ログイン。 */
async function signInWithGoogle(){
  if(!supabaseClient) return;
  const redirectTo = window.location.origin + window.location.pathname + "#mypage";
  try{
    const { data:{ session } } = await supabaseClient.auth.getSession();
    if(session && session.user && session.user.is_anonymous){
      await supabaseClient.auth.linkIdentity({ provider:"google", options:{ redirectTo } });
    }else{
      await supabaseClient.auth.signInWithOAuth({ provider:"google", options:{ redirectTo } });
    }
  }catch(e){ /* リダイレクトに失敗した場合は何もしない */ }
}
async function signOutUser(){
  if(!supabaseClient) return;
  try{ await supabaseClient.auth.signOut(); }catch(e){ /* ignore */ }
  state.userId = null;
  state.userEmail = null;
  await ensureSession();
  renderHeader();
  render();
}

async function submitApplication(fields){
  if(!supabaseClient) return { ok:false, message:"現在フォームを受け付けられません。時間をおいて再度お試しください。" };
  try{
    const ctx = state.applyContext || {};
    const { error } = await supabaseClient.from("applications").insert({
      user_id: state.userId || null,
      name: fields.name,
      email: fields.email,
      phone: fields.phone || null,
      message: fields.message || null,
      company_name: fields.companyName || null,
      current_role: fields.currentRole || null,
      job_change_intent: fields.jobChangeIntent || null,
      referred_pdm_type: ctx.pdmType || null,
      referred_seniority: ctx.seniority || null,
      referred_hensachi: ctx.hensachi ?? null,
    });
    if(error) return { ok:false, message:"送信に失敗しました。時間をおいて再度お試しください。" };
    return { ok:true };
  }catch(e){
    return { ok:false, message:"通信エラーが発生しました。時間をおいて再度お試しください。" };
  }
}

const PAGE_SIZE = 10;
function totalPageCount(){
  return Math.ceil(ALL_SKILLS_FLAT_META.length / PAGE_SIZE);
}
function pageIndices(pageIdx){
  const order = shuffledMasterOrder();
  return order.slice(pageIdx*PAGE_SIZE, pageIdx*PAGE_SIZE + PAGE_SIZE);
}
function firstUnfinishedPage(){
  const total = totalPageCount();
  for(let p=0;p<total;p++){
    const done = pageIndices(p).every(idx=>{
      const item = ALL_SKILLS_FLAT_META[idx];
      return state.answers[item.catKey+":"+item.name] != null;
    });
    if(!done) return p;
  }
  return 0;
}

const SCALE_SIZE_MAP = {1:52, 2:42, 3:34, 4:42, 5:52};
/* 5段階の同意尺度を、円の大きさで強度を表現するUI（16personalities風）。
   ラベルの有無に関わらず全ての列に同じ高さのラベル枠を確保することで、円の下端がきれいに揃う。 */
function renderScaleRow(key, currentVal){
  return `
    <div class="scale-row">
      ${LEVELS.map(l=>{
        const size = SCALE_SIZE_MAP[l.v];
        const showLabel = (l.v===1 || l.v===3 || l.v===5);
        return `
        <div class="scale-circle-wrap" data-v="${l.v}">
          <div class="scale-circle ${currentVal===l.v?'on':''}" style="width:${size}px; height:${size}px;"></div>
          <div class="scale-label" style="${showLabel?'':'visibility:hidden;'}">${showLabel ? l.label : '&nbsp;'}</div>
        </div>`;
      }).join("")}
    </div>`;
}

/* 1ページ10問のカードリスト形式。配色はバクラクのブルー×オレンジ基調を踏襲し、
   各カードの同意尺度は16personalities風の円サイズ表現を採用。 */
function renderAssess(){
  const total = totalPageCount();
  const idxList = pageIndices(state.pageIndex);
  const isLast = state.pageIndex === total-1;
  const pageDone = idxList.every(idx=>{
    const item = ALL_SKILLS_FLAT_META[idx];
    return state.answers[item.catKey+":"+item.name] != null;
  });
  const pct = Math.round(100*answeredCount()/TOTAL_SKILLS);
  const startNum = state.pageIndex*PAGE_SIZE + 1;
  const endNum = state.pageIndex*PAGE_SIZE + idxList.length;

  app.innerHTML = `
    <div class="thin-progress"><i style="width:${pct}%;"></i></div>
    <div class="q-counter">ページ ${state.pageIndex+1} / ${total}　（設問 ${startNum}〜${endNum} / ${TOTAL_SKILLS}）</div>

    <div class="q-card-list">
      ${idxList.map((idx)=>{
        const item = ALL_SKILLS_FLAT_META[idx];
        const key = item.catKey+":"+item.name;
        const currentVal = state.answers[key];
        return `
        <div class="q-card" data-idx="${idx}">
          <div class="q-card-statement">${item.statement}</div>
          ${renderScaleRow(key, currentVal)}
        </div>`;
      }).join("")}
    </div>

    <div class="q-nav q-nav-split">
      <button class="ghost" id="qBackBtn" ${state.pageIndex===0?"disabled style='opacity:.4;cursor:default;'":""}>← 前のページへ</button>
      <button class="primary" id="qNextBtn" ${pageDone?"":"disabled style='opacity:.4;cursor:default;'"}>${isLast? "次へ（タイプ診断）" : "次のページへ →"}</button>
    </div>
  `;

  app.querySelectorAll(".q-card").forEach(card=>{
    const idx = parseInt(card.getAttribute("data-idx"),10);
    const item = ALL_SKILLS_FLAT_META[idx];
    const key = item.catKey+":"+item.name;
    card.querySelectorAll(".scale-circle-wrap").forEach(wrap=>{
      wrap.onclick = async ()=>{
        const v = parseInt(wrap.getAttribute("data-v"),10);
        state.answers[key] = v;
        await saveProgress();
        renderAssess();
      };
    });
  });

  const backBtn = document.getElementById("qBackBtn");
  if(backBtn && state.pageIndex>0){
    backBtn.onclick = ()=>{ state.pageIndex--; render(); window.scrollTo(0,0); };
  }
  const nextBtn = document.getElementById("qNextBtn");
  if(nextBtn && pageDone){
    nextBtn.onclick = ()=>{
      if(isLast){ state.screen="mbti"; }
      else { state.pageIndex++; }
      render(); window.scrollTo(0,0);
    };
  }
}

/* ---------------- Radar chart (SVG, gradient fill) ---------------- */
function radarPoints(values, cx, cy, r){
  const n = values.length;
  return values.map((v,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const rad = r * (v/5);
    return [cx + rad*Math.cos(angle), cy + rad*Math.sin(angle)];
  });
}
function axisPoints(n, cx, cy, r){
  return Array.from({length:n}).map((_,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
}

function previewRadarSVG(){
  const size=260, cx=size/2, cy=size/2, r=90;
  const demo=[3,4,3,2,3,4,3,2];
  const pts = radarPoints(demo,cx,cy,r).map(p=>p.join(",")).join(" ");
  const axes = axisPoints(8,cx,cy,r);
  const rings=[0.25,0.5,0.75,1].map(f=>{
    const rp = axisPoints(8,cx,cy,r*f).map(p=>p.join(",")).join(" ");
    return `<polygon points="${rp}" fill="none" stroke="#DFE4EE" stroke-width="1"/>`;
  }).join("");
  const spokes = axes.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#DFE4EE" stroke-width="1"/>`).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs>
      <linearGradient id="previewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E5FD9"/>
        <stop offset="100%" stop-color="#101C36"/>
      </linearGradient>
    </defs>
    ${rings}${spokes}
    <polygon points="${pts}" fill="url(#previewGrad)" fill-opacity="0.22" stroke="url(#previewGrad)" stroke-width="2.5"/>
  </svg>`;
}

function resultsRadarSVG(){
  const size=380, cx=size/2, cy=size/2, r=128;
  const n = CATEGORIES.length;
  const values = CATEGORIES.map(categoryAverage);
  const pts = radarPoints(values,cx,cy,r).map(p=>p.join(",")).join(" ");
  const axes = axisPoints(n,cx,cy,r);
  const rings=[0.2,0.4,0.6,0.8,1].map(f=>{
    const rp = axisPoints(n,cx,cy,r*f).map(p=>p.join(",")).join(" ");
    return `<polygon points="${rp}" fill="none" stroke="#DFE4EE" stroke-width="1"/>`;
  }).join("");
  const spokes = axes.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#DFE4EE" stroke-width="1"/>`).join("");
  const labels = axes.map((p,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const lx = cx + (r+38)*Math.cos(angle);
    const ly = cy + (r+38)*Math.sin(angle);
    return `<text x="${lx}" y="${ly}" font-size="11.5" font-family="Noto Sans JP, sans-serif" fill="#131A2B" text-anchor="middle" dominant-baseline="middle">${CATEGORIES[i].name}</text>`;
  }).join("");
  const dots = radarPoints(values,cx,cy,r).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2E5FD9" stroke="#fff" stroke-width="1.5"/>`).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs>
      <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E5FD9"/>
        <stop offset="100%" stop-color="#0B1220"/>
      </linearGradient>
    </defs>
    ${rings}${spokes}
    <polygon points="${pts}" fill="url(#radarGrad)" fill-opacity="0.28" stroke="url(#radarGrad)" stroke-width="2.5"/>
    ${dots}${labels}
  </svg>`;
}

    ${matrix.slice().sort((a,b)=>b.avg-a.avg).map(row=>`
      <div class="matrix-row ${row.tone}">
        <div class="matrix-left">
          <div class="matrix-cat">${row.cat.name}</div>
          <span class="matrix-tag">${row.tag}</span>
        </div>
        <div class="matrix-score">${row.avg.toFixed(1)}</div>
        <div class="matrix-note">${row.text}</div>
      </div>`).join("")}

    <div class="section-label">この仕事を任せると強い</div>
    <div class="insight fusion">
      <p>${entrustRec.combined}</p>
      <div class="pill-row">
        ${entrustRec.entrust.map(t=>`<span class="pill">${t}</span>`).join("")}
      </div>
    </div>` : `
    <div class="section-label">属性タグ × スキル分析</div>
    <div class="insight" style="border-left-color:var(--ink-soft);">
      <p>MBTIを選択すると、性格タイプの属性タグと49項目のスコアを掛け合わせた詳細分析（得意・不得意な日常業務、意思決定スタイル、任せると強い仕事など）が表示されます。結果画面下部の「MBTIを選び直す」からいつでも追加できます。</p>
    </div>`}

    <div class="section-label">タイプ別スコア内訳</div>
    <div class="result-grid" style="margin-top:14px;">
      ${[["tech","テックドリブン"],["bizdev","BizDev"],["pmm","PMM"]].map(([k,label])=>{
        const v = typeResult.scores[k];
        return `<div>
          <div class="result-row-name"><span>${label}</span><b>${v.toFixed(1)}</b></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/5*100)}%; ${k===typeResult.key? '' : 'opacity:.4;'}"></div></div>
        </div>`;
      }).join("")}
    </div>

    <div class="radar-block">${resultsRadarSVG()}</div>

    <div class="result-grid">
      ${CATEGORIES.map(c=>{
        const a = categoryAverage(c);
        return `<div>
          <div class="result-row-name"><span>${c.name}</span><b>${a.toFixed(1)}</b></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(a/5*100)}%"></div></div>
        </div>`;
      }).join("")}
    </div>

    <div class="section-label">強み・弱みのSWOT分析</div>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:8px;">
      S・Wはスキル診断のスコアから、O・TはMBTIとの掛け合わせ分析（属性タグ×スキルスコア）から構成しています。
    </p>
    <div class="swot-grid">
      <div class="swot-quad s">
        <div class="swot-head"><span class="letter">S</span>強み Strengths</div>
        ${swot.S.map(item=>`<div class="swot-item"><b>${item.title}</b><span>${item.desc}</span></div>`).join("")}
      </div>
      <div class="swot-quad w">
        <div class="swot-head"><span class="letter">W</span>弱み Weaknesses</div>
        ${swot.W.map(item=>`<div class="swot-item"><b>${item.title}</b><span>${item.desc}</span></div>`).join("")}
      </div>
      <div class="swot-quad o">
        <div class="swot-head"><span class="letter">O</span>機会 Opportunities</div>
        ${swot.O.map(item=>`<div class="swot-item"><b>${item.title}</b><span>${item.desc}</span></div>`).join("")}
      </div>
      <div class="swot-quad t">
        <div class="swot-head"><span class="letter">T</span>脅威 Threats</div>
        ${swot.T.map(item=>`<div class="swot-item"><b>${item.title}</b><span>${item.desc}</span></div>`).join("")}
      </div>
    </div>

    <div class="pill-row">
      ${topSkills.map(s=>`<span class="pill strong"><b>${s.v}</b> ${s.name}</span>`).join("")}
      ${bottomSkills.map(s=>`<span class="pill weak"><b>${s.v}</b> ${s.name}</span>`).join("")}
    </div>

    <div class="section-label">弱みを補うアクション</div>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:8px;">
      平均3.5未満のカテゴリごとに、研修・実務経験・具体的タスクの3方向で近道になりそうなアクションをまとめました。
    </p>
    ${growthCats.length ? growthCats.map(c=>{
      const remedy = GROWTH_REMEDY[c.key];
      return `
      <div class="insight weak">
        <h4>${c.name} <b>${categoryAverage(c).toFixed(1)}</b></h4>
        <p><b style="color:var(--ink);">研修・学習：</b>${remedy.training}</p>
        <p><b style="color:var(--ink);">実務経験：</b>${remedy.experience}</p>
        <p><b style="color:var(--ink);">具体的タスク：</b>${remedy.task}</p>
      </div>`;
    }).join("") : `
    <div class="insight strong">
      <p>平均3.5未満のカテゴリはありません。現時点で明確な弱みはなく、得意領域をさらに伸ばすフェーズです。</p>
    </div>`}

    <div class="section-label">将来のキャリアパス</div>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:8px;">
      ジュニア→ミドル→シニアPdMとステップアップした先には、いくつかの分岐があります。金額は各種転職メディアの公開データをもとにした目安です。
    </p>
    <div class="career-main">
      ${careerPath.main.map(s=>`
        <div class="career-step ${s.current?'current':''}">
          ${s.current ? `<span class="now-badge">現在地</span>` : ""}
          <div class="bar" style="height:${s.height}px;"></div>
          <div class="label">${s.label}</div>
          <div class="years">${s.years}</div>
          <div class="salary">${s.salary}</div>
        </div>`).join("")}
    </div>
    <div class="career-branch-label">シニアPdMから、さらに広がる選択肢 ↓</div>
    <div class="career-branches">
      ${careerPath.branches.map(b=>`
        <div class="career-branch">
          <h5>${b.label}</h5>
          <span class="salary">${b.salary}</span>
          <p>${b.desc}</p>
        </div>`).join("")}
    </div>

    <div class="section-label">会社の文化から見る、求められるPdM像</div>
    ${state.orgScores ? `
    <div class="insight fusion" style="margin-top:14px;">
      <p>${buildOrgNarrative(state.orgScores)}</p>
    </div>
    ${(() => {
      const focusCats = buildOrgFocusCategories(state.orgScores);
      if(focusCats.length===0){
        return `<div class="insight"><p>各軸がバランス型に近いため、特定のスキルへの偏りは大きくありません。幅広い領域をバランス良く磨くのが向いているようです。</p></div>`;
      }
      return focusCats.map(f=>{
        const cat = CATEGORY_BY_KEY[f.catKey];
        const userScore = categoryAverage(cat);
        return `
        <div class="insight ${userScore>=3.5 ? 'strong' : 'weak'}">
          <h4>${cat.name} <b>${userScore.toFixed(1)}</b></h4>
          <p>${f.reasons[0]}</p>
          <p style="margin-top:6px;">${userScore>=3.5 ? "あなたはすでにこの領域が強みです。この組織の文化にフィットしやすいポイントと言えます。" : "この組織で特に重視される力ですが、あなたのスコアはまだ発展途上です。優先して伸ばすと組織にフィットしやすくなります。"}</p>
        </div>`;
      }).join("");
    })()}
    <div class="start-row" style="margin-top:14px;">
      <button class="ghost" id="orgRedoLink">組織タイプ診断をやり直す</button>
    </div>
    ` : `
    <div class="insight" style="margin-top:14px;">
      <p>組織タイプ診断（意思決定・評価軸・リスク姿勢・コミュニケーション文化の4軸で自社の傾向をチェック）を受けると、あなたのスキルと会社の文化を掛け合わせて、この組織で特に求められるPdM像を分析できます。</p>
    </div>
    <div class="start-row" style="margin-top:14px;">
      <button class="primary" id="orgDiagLink">組織タイプ診断を受ける →</button>
    </div>
    `}

    <div class="section-label">気が合いやすいメンバー</div>
    <div class="insight">
      <h4>スキルタイプの相性</h4>
      <p>${TEAM_FIT_BY_TYPE[typeResult.key]}</p>
    </div>
    ${teamFitMbti ? `
    <div class="insight fusion">
      <h4>性格タイプの相性（${state.mbti}）</h4>
      ${teamFitMbti.map(line=>`<p>${line}</p>`).join("")}
    </div>` : ""}

    <div class="section-label">あなたに近い公開求人</div>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:8px;">
      診断タイプ（${pdmType.label}）とレベル（${seniority.label}）に近い、実在の公開求人情報から抜粋しています。
      掲載企業・給与・募集状況は変動するため、応募の際は必ず出典元ページで最新情報をご確認ください。
    </p>
    ${matchedJobs.map(job=>`
      <a class="job-card" href="${job.url}" target="_blank" rel="noopener">
        <div class="job-company">${job.company}</div>
        <div class="job-title">${job.title}</div>
        <div class="job-meta">
          <span class="job-salary">${job.salary}</span>
          <span class="job-source">出典：${job.source}</span>
        </div>
      </a>`).join("")}

    <div class="cta-card">
      <div class="cta-text">
        <h4>もっと体系的にPdMスキルを鍛えたい方へ</h4>
        <p>「PdM登竜門」で、実践的なプロダクトマネジメントを学びませんか。</p>
      </div>
      <a class="primary cta-btn" id="toryumonBtn" href="./toryumon.html?pdmType=${typeResult.key}&seniority=${seniorityKey}&hensachi=${hensachi}" target="_blank" rel="noopener">PdM登竜門を見る →</a>
    </div>

    ${state.viewingHistory ? `
    <div class="start-row" style="margin-top:44px;">
      <button class="ghost" id="toHistoryBtn">履歴一覧に戻る</button>
      <button class="primary" id="toIntroBtn">新しく診断する</button>
    </div>
    ` : `
    <div class="start-row" style="margin-top:44px;">
      <button class="primary" id="retryBtn">回答を修正する</button>
      <button class="ghost" id="mbtiEditBtn">MBTIを選び直す</button>
      <button class="ghost" id="profileEditBtn">語学・資格を編集</button>
      ${supabaseClient ? `<button class="ghost" id="historyBtn">マイページを見る</button>` : ""}
      <button class="ghost" id="resetBtn">最初からやり直す</button>
    </div>
    `}

    <footer class="note">
      本診断はセルフチェック用の簡易ツールです。半年に一度など定期的に見直すことで、成長やスキルの重心の変化を確認しやすくなります。
      MBTIとの掛け合わせも、公開されている性格類型論の一般的傾向を業務文脈に翻訳した簡易的な分析であり、断定的な適性診断ではありません。
      PdM偏差値・想定年収幅・公開求人も、いずれも参考情報であり、個人の適性や収入を保証するものではありません。
      回答データはお使いのブラウザ内にのみ保存されます。詳しくは<a href="./privacy.html">プライバシーポリシー</a>をご覧ください。
    </footer>
  `;

  const backToHistoryLink = document.getElementById("backToHistoryLink");
  if(backToHistoryLink){
    backToHistoryLink.onclick = (e)=>{ e.preventDefault(); state.viewingHistory=null; state.screen="history"; render(); window.scrollTo(0,0); };
  }
  const orgDiagLink = document.getElementById("orgDiagLink");
  if(orgDiagLink) orgDiagLink.onclick = ()=>{ state.screen="orgIntro"; render(); window.scrollTo(0,0); };
  const orgRedoLink = document.getElementById("orgRedoLink");
  if(orgRedoLink) orgRedoLink.onclick = ()=>{
    state.orgAnswers = {}; state.orgScores = null; state.orgDisplayOrder = null;
    state.screen="orgAssess"; render(); window.scrollTo(0,0);
  };

  if(state.viewingHistory){
    document.getElementById("toHistoryBtn").onclick = ()=>{
      state.viewingHistory=null;
      state.screen="history";
      render(); window.scrollTo(0,0);
    };
    document.getElementById("toIntroBtn").onclick = ()=>{
      state.viewingHistory=null;
      state.answers = {};
      state.mbti = null;
      state.displayOrder = {};
      state.profile = { toeic:null, certifications:"", nickname:"", experienceYears:null };
      state.savedThisResult = false;
      state.screen="intro";
      render(); window.scrollTo(0,0);
    };
    return;
  }

  document.getElementById("retryBtn").onclick = ()=>{
    state.screen="assess";
    state.pageIndex=0;
    render(); window.scrollTo(0,0);
  };
  document.getElementById("mbtiEditBtn").onclick = ()=>{
    state.screen="mbti";
    render(); window.scrollTo(0,0);
  };
  const profileEditBtn = document.getElementById("profileEditBtn");
  if(profileEditBtn){
    profileEditBtn.onclick = ()=>{
      state.screen="profile";
      render(); window.scrollTo(0,0);
    };
  }
  const historyBtn = document.getElementById("historyBtn");
  if(historyBtn){
    historyBtn.onclick = ()=>{
      state.screen="history";
      render(); window.scrollTo(0,0);
    };
  }
  document.getElementById("resetBtn").onclick = async ()=>{
    state.answers = {};
    state.mbti = null;
    state.displayOrder = {};
    state.profile = { toeic:null, certifications:"", nickname:"", experienceYears:null };
    state.savedThisResult = false;
    await saveProgress();
    state.screen="intro";
    render(); window.scrollTo(0,0);
  };
}

(async function boot(){
  await ensureSession();
  const params = new URLSearchParams(window.location.search);
  if(params.has("pdmType") || params.has("seniority") || params.has("hensachi")){
    state.applyContext = {
      pdmType: params.get("pdmType") || null,
      seniority: params.get("seniority") || null,
      hensachi: params.get("hensachi") ? parseInt(params.get("hensachi"),10) : null,
    };
  }
  if(window.location.hash === "#apply"){
    state.screen = "apply";
  }else if(window.location.hash === "#mypage"){
    state.screen = "mypage";
  }else if(window.location.hash === "#orgculture"){
    state.screen = "orgIntro";
  }
  const navMypageLink = document.getElementById("navMypageLink");
  if(navMypageLink){
    navMypageLink.onclick = (e)=>{ e.preventDefault(); state.screen="mypage"; render(); window.scrollTo(0,0); };
  }
  const navOrgLink = document.getElementById("navOrgLink");
  if(navOrgLink){
    navOrgLink.onclick = (e)=>{ e.preventDefault(); state.screen="orgIntro"; render(); window.scrollTo(0,0); };
  }
  renderHeader();
  render();
})();
</script>
</body>
</html>
